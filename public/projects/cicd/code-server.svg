<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1e1e1e"/>
  <rect width="960" height="36" fill="#2d2d2d"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="6" fill="#febc2e"/>
  <circle cx="60" cy="18" r="6" fill="#28c840"/>
  <text x="90" y="24" fill="#cccccc" font-family="Consolas, monospace" font-size="13">app/src/server.js</text>
  <text x="24" y="72" fill="#c586c0" font-family="Consolas, monospace" font-size="14">const</text><text x="72" y="72" fill="#9cdcfe" font-family="Consolas, monospace" font-size="14"> express</text><text x="168" y="72" fill="#d4d4d4" font-family="Consolas, monospace" font-size="14"> = </text><text x="200" y="72" fill="#dcdcaa" font-family="Consolas, monospace" font-size="14">require('express')</text>
  <text x="24" y="104" fill="#c586c0" font-family="Consolas, monospace" font-size="14">const</text><text x="72" y="104" fill="#9cdcfe" font-family="Consolas, monospace" font-size="14"> app</text><text x="120" y="104" fill="#d4d4d4" font-family="Consolas, monospace" font-size="14"> = express()</text>
  <text x="24" y="152" fill="#9cdcfe" font-family="Consolas, monospace" font-size="14">app.get</text><text x="88" y="152" fill="#ce9178" font-family="Consolas, monospace" font-size="14">('/',</text><text x="136" y="152" fill="#dcdcaa" font-family="Consolas, monospace" font-size="14"> (_req, res) =&gt; {</text>
  <text x="40" y="184" fill="#9cdcfe" font-family="Consolas, monospace" font-size="14">res.json</text><text x="120" y="184" fill="#dcdcaa" font-family="Consolas, monospace" font-size="14">({ status: 'running', ... })</text>
  <text x="24" y="216" fill="#dcdcaa" font-family="Consolas, monospace" font-size="14">})</text>
  <text x="24" y="264" fill="#9cdcfe" font-family="Consolas, monospace" font-size="14">app.get</text><text x="88" y="264" fill="#ce9178" font-family="Consolas, monospace" font-size="14">('/health',</text><text x="184" y="264" fill="#dcdcaa" font-family="Consolas, monospace" font-size="14"> (_req, res) =&gt; {</text>
  <text x="40" y="296" fill="#9cdcfe" font-family="Consolas, monospace" font-size="14">res.status</text><text x="136" y="296" fill="#dcdcaa" font-family="Consolas, monospace" font-size="14">(200).json({ healthy: true })</text>
  <text x="24" y="328" fill="#dcdcaa" font-family="Consolas, monospace" font-size="14">})</text>
  <text x="24" y="376" fill="#9cdcfe" font-family="Consolas, monospace" font-size="14">app.listen</text><text x="120" y="376" fill="#dcdcaa" font-family="Consolas, monospace" font-size="14">(PORT, () =&gt; console.log('Server listening'))</text>
  <rect x="0" y="500" width="960" height="40" fill="#252526"/>
  <text x="24" y="525" fill="#858585" font-family="Segoe UI, sans-serif" font-size="12">Node.js API  runs inside ECS container on AWS</text>
