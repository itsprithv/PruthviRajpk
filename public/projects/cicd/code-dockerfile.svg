<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1e1e1e"/>
  <rect width="960" height="36" fill="#2d2d2d"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="6" fill="#febc2e"/>
  <circle cx="60" cy="18" r="6" fill="#28c840"/>
  <text x="90" y="24" fill="#cccccc" font-family="Consolas, monospace" font-size="13">app/Dockerfile</text>
  <text x="24" y="72" fill="#569cd6" font-family="Consolas, monospace" font-size="14">FROM</text><text x="88" y="72" fill="#ce9178" font-family="Consolas, monospace" font-size="14"> node:22-alpine</text>
  <text x="24" y="104" fill="#569cd6" font-family="Consolas, monospace" font-size="14">WORKDIR</text><text x="112" y="104" fill="#ce9178" font-family="Consolas, monospace" font-size="14"> /app</text>
  <text x="24" y="136" fill="#569cd6" font-family="Consolas, monospace" font-size="14">COPY</text><text x="72" y="136" fill="#ce9178" font-family="Consolas, monospace" font-size="14"> package.json ./</text>
  <text x="24" y="168" fill="#569cd6" font-family="Consolas, monospace" font-size="14">RUN</text><text x="64" y="168" fill="#dcdcaa" font-family="Consolas, monospace" font-size="14"> npm install --omit=dev</text>
  <text x="24" y="200" fill="#569cd6" font-family="Consolas, monospace" font-size="14">COPY</text><text x="72" y="200" fill="#ce9178" font-family="Consolas, monospace" font-size="14"> src ./src</text>
  <text x="24" y="232" fill="#569cd6" font-family="Consolas, monospace" font-size="14">ENV</text><text x="64" y="232" fill="#9cdcfe" font-family="Consolas, monospace" font-size="14"> NODE_ENV=production</text>
  <text x="24" y="264" fill="#569cd6" font-family="Consolas, monospace" font-size="14">EXPOSE</text><text x="96" y="264" fill="#b5cea8" font-family="Consolas, monospace" font-size="14"> 3000</text>
  <text x="24" y="296" fill="#569cd6" font-family="Consolas, monospace" font-size="14">HEALTHCHECK</text><text x="144" y="296" fill="#dcdcaa" font-family="Consolas, monospace" font-size="14"> CMD wget /health</text>
  <text x="24" y="328" fill="#569cd6" font-family="Consolas, monospace" font-size="14">CMD</text><text x="64" y="328" fill="#ce9178" font-family="Consolas, monospace" font-size="14"> ["npm", "start"]</text>
  <rect x="0" y="500" width="960" height="40" fill="#252526"/>
  <text x="24" y="525" fill="#858585" font-family="Segoe UI, sans-serif" font-size="12">Docker  container image pushed to Amazon ECR</text>
</svg>
